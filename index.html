<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Orca Releases</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0d1117;
        color: #c9d1d9;
    }

    header {
        padding: 40px 20px;
        text-align: center;
        background: #161b22;
        border-bottom: 1px solid #30363d;
    }

    h1 {
        margin: 0;
        color: white;
        font-size: 36px;
    }

    header p {
        color: #8b949e;
    }

    .container {
        max-width: 900px;
        margin: 30px auto;
        padding: 0 20px;
    }

    .file {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;

        padding: 18px;
        margin-bottom: 12px;

        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 10px;
    }

    .file-name {
        font-weight: bold;
        color: white;
        word-break: break-all;
    }

    .file-size {
        color: #8b949e;
        font-size: 13px;
        margin-top: 5px;
    }

    a {
        background: #238636;
        color: white;
        text-decoration: none;
        padding: 9px 16px;
        border-radius: 7px;
        white-space: nowrap;
    }

    a:hover {
        background: #2ea043;
    }

    .error {
        text-align: center;
        color: #f85149;
        padding: 30px;
    }

    footer {
        text-align: center;
        padding: 30px;
        color: #8b949e;
    }
</style>
</head>

<body>

<header>
    <h1>🚀 Orca Releases</h1>
    <p>Download the latest files</p>
</header>

<div class="container">

    <div id="files">
        Loading files...
    </div>

</div>

<footer>
    Hosted with GitHub Pages
</footer>

<script>
const username = "orcawannakham-sudo";
const repo = "orcawannakham-sudo.github.io";

const filesContainer = document.getElementById("files");

async function loadFiles() {
    try {
        const response = await fetch(
            `https://api.github.com/repos/${username}/${repo}/git/trees/main?recursive=1`
        );

        if (!response.ok) {
            throw new Error("GitHub API error");
        }

        const data = await response.json();

        filesContainer.innerHTML = "";

        const files = data.tree.filter(
            item =>
                item.type === "blob" &&
                item.path !== "index.html"
        );

        if (files.length === 0) {
            filesContainer.innerHTML =
                "<p>No release files found.</p>";
            return;
        }

        files.forEach(file => {

            const div = document.createElement("div");
            div.className = "file";

            const encodedPath = file.path
                .split("/")
                .map(encodeURIComponent)
                .join("/");

            const downloadURL =
                `https://raw.githubusercontent.com/${username}/${repo}/main/${encodedPath}`;

            div.innerHTML = `
                <div>
                    <div class="file-name">📦 ${file.path}</div>
                    <div class="file-size">
                        ${(file.size / 1024).toFixed(1)} KB
                    </div>
                </div>

                <a href="${downloadURL}" download>
                    Download
                </a>
            `;

            filesContainer.appendChild(div);
        });

    } catch (error) {

        filesContainer.innerHTML = `
            <div class="error">
                ❌ Failed to load files from GitHub.
            </div>
        `;

        console.error(error);
    }
}

loadFiles();
</script>

</body>
</html>
